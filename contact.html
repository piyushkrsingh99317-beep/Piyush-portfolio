	<h1>Contact Me</h1>
	<p>You can contact me through this page.</p>
	<form id="contactForm" class="contact-form" action="#" method="post" novalidate>
		<div class="form-field">
			<label for="full-name">Full Name</label>
			<input id="full-name" name="full-name" type="text" placeholder="Enter your full name" required>
		</div>

		<div class="form-field">
			<label for="email">Email</label>
			<input id="email" name="email" type="email" placeholder="you@example.com" required>
		</div>

		<div class="form-field">
			<label for="message">Message</label>
			<textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>
		</div>

		<button type="submit">Send Message</button>
		<p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
	</form>

			</div>

</body>
